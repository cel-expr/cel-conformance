# Publish to Bazel Central Registry
# See https://github.com/bazel-contrib/publish-to-bcr/tree/main/templates

name: Publish to BCR
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: The release tag to publish
        required: true
        type: string
permissions: {}

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@748dc7186bc60d0e24a81ee30aba8aa543794767 # v1.0.0
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      attest: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
