syntax = "proto3";

package cel.expr.conformance.test.env;

import "cel/expr/conformance/env_config.proto";
import "cel/expr/conformance/test/suite.proto";

option cc_enable_arenas = true;
option go_package = "github.com/cel-expr/cel-conformance/test/env";
option java_multiple_files = true;
option java_outer_classname = "SuiteProto";
option java_package = "dev.cel.expr.conformance.test.env";

// A test suite is a collection of tests designed to evaluate the correctness of
// a CEL environment.
message TestSuite {
  // The name of the test suite.
  string name = 1;

  // Description of the test suite.
  string description = 2;

  // Test sections of the test suite.
  // Each section represents a behavior to be tested.
  repeated TestSection sections = 3;
}

// A collection of related test cases.
message TestSection {
  // Name of the test section.
  string name = 1;

  // Description of the test section.
  string description = 2;

  // Test cases of the test section.
  // Each test case represents a test scenario.
  repeated TestCase tests = 3;
}

// A test case which validates the behavior of a CEL environment.
message TestCase {
  // Name of the test case.
  string name = 1;

  // A description of the test.
  string description = 2;

  oneof env_config {
    // The environment to be used for compilation and evaluation of the CEL
    // expression for the current test case, specified as a YAML string.
    string env_yaml = 3;

    // The environment to be used for compilation and evaluation of the CEL
    // expression for the current test case.
    cel.expr.conformance.Environment env = 4;
  }

  // Expected result of the environment configuration test case.
  TestOutput output = 5;

  // Optional expression check and evaluation sub-tests to run against the
  // configured environment. These sub-tests ensure that the elements of the
  // environment configuration under test are consistently interpreted by the
  // checker and evaluator across all conformant CEL stacks.
  repeated cel.expr.conformance.test.TestCase expr_tests = 6;
}

// Expected result of the test case.
message TestOutput {
  // The expected exported environment YAML of the test case.
  string exported_env_yaml = 1;

  // Expected error substrings. Success if all expected errors match.
  repeated string errors = 4;
}
