matrix:
  platform:
    - debian11
    - ubuntu2004
  bazel:
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--incompatible_autoload_externally=proto_library,cc_proto_library,java_proto_library,py_proto_library'
    build_targets:
      - '@cel-conformance//...'
